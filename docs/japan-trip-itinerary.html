    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #2c3e50;
            height: 100vh;
            overflow: hidden;
        }

        .app-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            flex-shrink: 0;
        }

        .header-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 16px;
        }

        .header-row > div { min-width: 0; }

        .place-names-link {
            flex: none;
            padding: 8px 12px;
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 9px;
            color: white;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.12);
            white-space: nowrap;
        }

        .place-names-link:hover { background: rgba(255, 255, 255, 0.22); }

        .app-header h1 {
            font-size: 20px;
            font-weight: 600;
        }

        .app-header .subtitle {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 4px;
        }

        .container {
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr) minmax(0, 1fr);
            height: calc(100vh - 72px);
            gap: 16px;
            padding: 16px;

        .panel {
            min-width: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            padding: 16px;
            border-bottom: 1px solid #eef2f7;
            font-weight: 600;
            font-size: 15px;
            color: #4a5568;
            background: #fafbfc;
        }

        /* 第一栏：日期切换 */
        .day-list {
            overflow-y: auto;
            flex: 1;
            padding: 8px;
        }

        .overview-button {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 12px 12px 8px 12px;
            padding: 14px 12px;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8eeff 100%);
            border: 1px solid #c3dafe;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .overview-button:hover {
            background: linear-gradient(135deg, #e8eeff 0%, #d6e0ff 100%);
            transform: translateY(-1px);
        }

        .overview-button.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: #667eea;
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .overview-button .overview-icon {
            font-size: 22px;
            line-height: 1;
        }

        .overview-button .overview-title {
            font-size: 15px;
            font-weight: 600;
            color: #4c51bf;
        }

        .overview-button.active .overview-title {
            color: white;
        }

        .overview-button .overview-desc {
            font-size: 12px;
            color: #718096;
            margin-top: 2px;
        }

        .overview-button.active .overview-desc {
            color: rgba(255, 255, 255, 0.85);
        }

        .day-item {
            padding: 14px 12px;
            margin-bottom: 6px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-left: 3px solid transparent;
        }

        .day-item:hover {
            background: #f0f4ff;
        }

        .day-item.active {
            background: #e8eeff;
            border-left-color: #667eea;
        }

        .day-item .day-label {
            font-size: 13px;
            color: #718096;
            margin-bottom: 2px;
        }

        .day-item.active .day-label {
            color: #5a67d8;
        }

        .day-item .day-title {
            font-size: 15px;
            font-weight: 600;
            color: #2d3748;
        }

        .day-item .day-date {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 2px;
        }

        /* 第二栏：详细日程 */
        .detail-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .detail-header {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 2px solid #eef2f7;
        }

        .detail-header .badge {
            display: inline-block;
            padding: 4px 10px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .detail-header h2 {
            font-size: 22px;
            color: #2d3748;
            margin-bottom: 6px;
        }

        .detail-header .meta {
            font-size: 14px;
            color: #718096;
        }

        .timeline {
            position: relative;
            padding-left: 24px;
            margin-top: 24px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 4px;
            bottom: 4px;
            width: 2px;
            background: #e2e8f0;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 20px;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -22px;
            top: 4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #cbd5e0;
            border: 2px solid white;
            box-shadow: 0 0 0 2px #cbd5e0;
        }

        .timeline-item.highlight::before {
            background: #667eea;
            box-shadow: 0 0 0 2px #667eea;
        }

        .timeline-item.transport::before {
            background: #48bb78;
            box-shadow: 0 0 0 2px #48bb78;
        }

        .timeline-item .time {
            font-size: 13px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .timeline-item .event {
            font-size: 15px;
            color: #2d3748;
            line-height: 1.6;
        }

        .timeline-item .note {
            font-size: 13px;
            color: #718096;
            margin-top: 4px;
            line-height: 1.5;
        }

        .hotel-card {
            background: linear-gradient(135deg, #fffaf0 0%, #fff5f5 100%);
            border: 1px solid #fed7d7;
            border-radius: 12px;
            padding: 16px;
            margin-top: 24px;
        }

        .hotel-card .hotel-label {
            font-size: 12px;
            color: #c05621;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hotel-card .hotel-name {
            font-size: 16px;
            font-weight: 600;
            color: #744210;
            margin-bottom: 4px;
        }

        .hotel-card .hotel-info {
            font-size: 13px;
            color: #9c4221;
            line-height: 1.5;
        }

        .no-hotel {
            background: #f7fafc;
            border: 1px dashed #cbd5e0;
            border-radius: 12px;
            padding: 16px;
            margin-top: 24px;
            text-align: center;
            color: #718096;
            font-size: 14px;
        }

        .place-names { margin-top: 24px; }
        .place-names h3 { font-size: 16px; margin-bottom: 8px; }
        .place-names-scroll { overflow-x: auto; margin: 12px 0; }
        .place-names table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .place-names th, .place-names td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
        .place-names th { background: #f5f7ff; color: #4a5568; }
        .place-names td:first-child { width: 35%; }
        .place-names strong { font-weight: 600; }
        .place-kana { display: block; margin-top: 4px; color: #667eea; line-height: 1.6; overflow-wrap: anywhere; }
        .place-names a { color: #5a67d8; }

        /* 第三栏：地图 */
        #map {
            flex: 1;
            width: 100%;
            min-height: 400px;
        }

        .leaflet-tooltip.trip-place-label {
            padding: 3px 7px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.95);
            color: #334155;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.12);
            pointer-events: none;
        }

        .route-day-badge {
            width: 22px;
            height: 22px;
            padding: 2px;
            text-align: center;
            border: 1px solid currentColor;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.96);
            font-size: 11px;
            font-weight: 600;
            line-height: 16px;
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.12);
        }

        .map-legend {
            padding: 12px 16px;
            border-top: 1px solid #eef2f7;
            background: #fafbfc;
            font-size: 12px;
            color: #718096;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .map-legend span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .legend-dot.start { background: #48bb78; }
        .legend-dot.stay { background: #667eea; }
        .legend-dot.visit { background: #ed8936; }

        @media (max-width: 1024px) {
            body {
                height: auto;
                overflow: auto;
            }

            .app-header {
                padding: 12px 16px;
            }

            .app-header h1 {
                font-size: 18px;
            }

            .app-header .subtitle {
                font-size: 12px;
            }

            .container {
                display: flex;
                flex-direction: column;
                height: auto;
                min-height: calc(100vh - 64px);
                gap: 12px;
                padding: 12px max(12px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            }

            .container.overview-mode {
                display: flex;
                flex-direction: column;
            }

            .panel {
                min-height: 0;
            }

            .panel:first-child {
                flex: 0 0 auto;
            }

            .panel:nth-child(2) {
                order: 3;
                flex: none;
            }

            .panel:nth-child(3) {
                order: 2;
                flex: none;
            }

            .panel-header {
                padding: 10px 14px;
                font-size: 14px;
            }

            .overview-button {
                margin: 8px 12px;
                padding: 10px 12px;
            }

            .overview-button .overview-icon {
                font-size: 20px;
            }

            .overview-button .overview-title {
                font-size: 14px;
            }

            .overview-button .overview-desc {
                font-size: 11px;
            }

            .day-list {
                display: flex;
                overflow-x: auto;
                overflow-y: hidden;
                gap: 8px;
                scroll-snap-type: x proximity;
                padding: 0 12px 12px 12px;
            }

            .day-item {
                flex: 0 0 124px;
                scroll-snap-align: start;
                padding: 12px;
                margin-bottom: 0;
            }

            .day-item .day-label {
                font-size: 11px;
            }

            .day-item .day-title {
                font-size: 14px;
            }

            .day-item .day-date {
                font-size: 11px;
            }

            .detail-content {
                flex: none;
                overflow: visible;
                padding: 16px;
            }

            .detail-content .note, .hotel-info {
                line-height: 1.8;
                overflow-wrap: anywhere;
            }

            .detail-header h2 {
                font-size: 20px;
            }

            .detail-header .meta {
                font-size: 13px;
            }

            #map {
                flex: none;
                min-height: 340px;
                height: 48svh;
                max-height: 520px;
            }

            .map-legend {
                padding: 10px 14px;
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .app-header { padding: 13px 16px; }
            .header-row { align-items: start; gap: 10px; }
            .place-names-link { padding: 7px 9px; font-size: 12px; }
            .app-header h1 { font-size: 17px; }
            .app-header .subtitle { line-height: 1.6; }
            .overview-button .overview-desc { font-size: 12px; }
            .day-item .day-date { white-space: nowrap; }
            .detail-header h2 { font-size: 19px; }
            .hotel-name { font-size: 16px; overflow-wrap: anywhere; }
            .leaflet-tooltip.trip-place-label { font-size: 11px; padding: 2px 5px; }
            .leaflet-touch .leaflet-bar a { width: 40px; height: 40px; line-height: 40px; }
            .map-legend { gap: 8px 12px; line-height: 1.6; }
            .place-names th, .place-names td { padding: 10px 6px; }
        }
    </style>
</head>

        function renderPlaceNames(day) {
            const places = day ? placeNames.filter(p => p.days.includes(day)) : placeNames;
            return `<section class="place-names">
                <h3>日语地名与假名</h3>
                <p class="note">问路或查导航时可出示日语名；假名用于读音，外来语保留片假名。</p>
                <div class="place-names-scroll"><table>
                    <thead><tr><th>中文名</th><th>日语名 / 假名</th></tr></thead>
                    <tbody>${places.map(p => `<tr><td>${p.zh}</td><td lang="ja"><strong>${p.ja}</strong><span class="place-kana">${p.kana}</span></td></tr>`).join('')}</tbody>
                </table></div>
                <p class="note">名称参考：<a href="https://www.hachimangu.or.jp/" target="_blank" rel="noopener noreferrer">鶴岡八幡宮</a> · <a href="https://omuroyama.com/" target="_blank" rel="noopener noreferrer">大室山</a> · <a href="https://ataminews.gr.jp/" target="_blank" rel="noopener noreferrer">热海旅游官网</a></p>
            </section>`;
        }

        let map;
        let markers = [];
        let routeLine = null;

        function initMap() {
            map = L.map('map').setView([35.45, 139.2], 8);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                minZoom: 0,
                maxNativeZoom: 16,
                maxZoom: 18,
                attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a> &mdash; Esri, DeLorme, NAVTEQ'
            }).addTo(map);
        }

        const colors = {
            start: '#48bb78',
            stay: '#667eea',
            visit: '#ed8936'
        };

        function clearMapLayers() {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            if (routeLine) {
                map.removeLayer(routeLine);
                routeLine = null;
            }
        }

        function drawMarkers(pointsData) {
            const seenPlaces = new Set();
            pointsData.forEach(point => {
                const placeKey = JSON.stringify([point.name, point.lat, point.lng]);
                if (seenPlaces.has(placeKey)) return;
                seenPlaces.add(placeKey);
                const marker = L.circleMarker([point.lat, point.lng], {
                    radius: 9,
                    fillColor: colors[point.type] || '#718096',
                    color: '#ffffff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.9
                }).addTo(map);

                const label = document.createElement('span');
                label.textContent = point.name;
                marker.bindTooltip(label, {
                    permanent: true,
                    direction: 'top',
                    offset: [0, -11],
                    opacity: 1,
                    className: 'trip-place-label'
                });
                marker.bindPopup(`<b>${point.name}</b><br>${point.type === 'start' ? '起止/机场' : point.type === 'stay' ? '住宿地' : '游览地'}`);
                markers.push(marker);
            });
        }

        function getRoutePoints(data) {
            return data.routeOrder.map(index => data.mapPoints[index]);
        }

        function drawRoute(data) {
            const points = getRoutePoints(data);
            const overviewDays = data.routeDays;
            // 按总览各段分配弧度：热海转场与机场返程绕开中间的日游线路。
            const overviewBends = data.routeBends || [];

            const labeledDays = new Set();
            routeLine = L.layerGroup().addTo(map);
            for (let i = 1; i < points.length; i++) {
                const from = points[i - 1];
                const to = points[i];
                const day = data.isOverview ? overviewDays[i - 1] : data.day;
                const returning = (to.type === 'stay' && from.type === 'visit') || to.type === 'start';
                const color = returning ? '#0d9488' : '#667eea';
                const start = map.project([from.lat, from.lng], 10);
                const end = map.project([to.lat, to.lng], 10);
                const dx = end.x - start.x;
                const dy = end.y - start.y;
                if (dx === 0 && dy === 0) continue;
                // 反向路段使用相同符号的弧度，自然落在连线两侧。
                const bend = (data.isOverview ? overviewBends[i - 1] : data.routeBends?.[i - 1]) ?? 0.18;
                const control = L.point((start.x + end.x) / 2 - dy * bend,
                    (start.y + end.y) / 2 + dx * bend);
                const curve = Array.from({ length: 25 }, (_, n) => {
                    const t = n / 24;
                    return map.unproject(L.point(
                        (1 - t) ** 2 * start.x + 2 * (1 - t) * t * control.x + t ** 2 * end.x,
                        (1 - t) ** 2 * start.y + 2 * (1 - t) * t * control.y + t ** 2 * end.y
                    ), 10);
                });
                const label = `第 ${day} 天：${from.name} → ${to.name}${returning ? '（返程）' : ''}`;
                L.polyline(curve, {
                    color, weight: 3, opacity: 0.85,
                    dashArray: returning ? '4, 7' : '8, 7'
                }).bindTooltip(label, { sticky: true }).addTo(routeLine);
                const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                L.marker(curve[12], {
                    icon: L.divIcon({
                        className: 'route-direction',
                        html: `<span style="display:block;color:${color};font-size:18px;line-height:20px;text-align:center;transform:rotate(${angle}deg)">➤</span>`,
                        iconSize: [20, 20], iconAnchor: [10, 10]
                    }),
                    keyboard: false, interactive: false
                }).addTo(routeLine);
                if (!labeledDays.has(day) && !(data.isOverview && [2].includes(day))) {
                    labeledDays.add(day);
                    L.marker(curve[15], {
                        icon: L.divIcon({
                            className: 'route-day-label',
                            html: `<span class="route-day-badge" style="display:block;color:${color}">${day}</span>`,
                            iconSize: [22, 22], iconAnchor: [11, -5]
                        }),
                        keyboard: false
                    }).bindTooltip(label).addTo(routeLine);
                }
            }
        }

        function updateMap(data) {
            clearMapLayers();
            drawMarkers(data.mapPoints);
            drawRoute(data);
            document.getElementById('mapRouteNote').textContent = data.mapNote || '线路为景点间示意，位置为概略标注；实际交通请按导航。';
            if (window.matchMedia('(max-width: 1024px)').matches) {
                const bounds = L.latLngBounds(data.mapPoints.map(p => [p.lat, p.lng]));
                routeLine.eachLayer(layer => {
                    if (layer.getBounds) bounds.extend(layer.getBounds());
                });
                map.flyToBounds(bounds, { padding: [45, 45], maxZoom: data.mapZoom, duration: 0.6 });
            } else {
                map.flyTo(data.mapCenter, data.mapZoom, { duration: 1.2 });
            }
        }

        function renderDayList() {
            const list = document.getElementById('dayList');
            list.innerHTML = itinerary.map((item) => `
                <div class="day-item" data-index="${item.day - 1}">
                    <div class="day-label">Day ${item.day}</div>
                    <div class="day-title">${item.title}</div>
                    <div class="day-date">${item.date}</div>
                </div>
            `).join('');

            list.querySelectorAll('.day-item').forEach(el => {
                el.addEventListener('click', () => {
                    selectDay(parseInt(el.dataset.index));
                });
            });
        }

        function bindOverviewButton() {
            document.getElementById('overviewButton').addEventListener('click', selectOverview);
        }

        function renderOverview() {
            const detail = document.getElementById('detailContent');
            const summaryHtml = overview.summary.map(s => `
                <div class="timeline-item highlight">
                    <div class="event">${s.label}</div>
                    <div class="note">${s.value}</div>
                </div>
            `).join('');

            const dayListHtml = overview.daySummaries.map(d => `
                <div class="timeline-item">
                    <div class="time">Day ${d.day} · ${itinerary[d.day - 1].date}</div>
                    <div class="event">${d.title}</div>
                    <div class="note">${d.description}</div>
                </div>
            `).join('');

            detail.innerHTML = `
                <div class="detail-header">
                    <div class="badge">${overview.badge}</div>
                    <h2>${overview.title}</h2>
                    <div class="meta">${overview.date} · ${overview.meta}</div>
                </div>
                <div class="hotel-card" style="background: linear-gradient(135deg, #f0f4ff 0%, #e8eeff 100%); border-color: #c3dafe;">
                    <div class="hotel-label" style="color: #4c51bf;">🗺️ 路线概览</div>
                    <div class="hotel-name" style="color: #434190;">成田机场 → 东京 → 富士山 → 东京 → 镰仓 → 东京 → 热海 → 伊豆高原 → 热海 → 成田机场</div>
                    <div class="hotel-info" style="color: #4c51bf;">全程 7 天 6 晚：东京 · 三井花园饭店上野 4 晚；热海 · 贯一酒店 2 晚。</div>
                </div>
                <div class="timeline">
                    ${summaryHtml}
                </div>
                <div style="margin-top: 24px; font-weight: 600; color: #4a5568; margin-bottom: 12px;">每日行程描述</div>
                <div class="timeline">
                    ${dayListHtml}
                </div>
                <section class="place-names">
                    <h3>交通与预约</h3>
                    <p class="note">按截图的日期顺序重排，抵达日计为第 1 天。以下时间为行程安排，车次、票价及营业时间出发前确认。</p>
                    <ul style="padding-left: 20px; line-height: 1.9; font-size: 13px;">
                        <li><a href="https://www.shibuya-scramble-square.com/sky/ticket/" target="_blank" rel="noopener noreferrer">SHIBUYA SKY 官方购票</a>：先确定入场时段，再安排涩谷晚餐。</li>
                        <li>富士山一日游：核对团单集合点、结束地点和包含项目；地图仅示意富士山方向。</li>
                        <li><a href="https://www.enoden.co.jp/" target="_blank" rel="noopener noreferrer">江之电</a>：按当天乘车次数比较单程票和一日券；JR、湘南单轨交通分别确认。</li>
                        <li><a href="https://www.izukyu.co.jp/global_site/" target="_blank" rel="noopener noreferrer">伊豆急行</a> · <a href="https://omuroyama.com/access/" target="_blank" rel="noopener noreferrer">大室山交通</a>：确认列车、巴士及缆车运营，伊豆高原当天返回热海。</li>
                        <li>热海站前足汤是「家康の湯」，不是截图中的「热海银汤」；<a href="https://www.city.atami.lg.jp/kanko/kankoshisetsu/1001839/1001841.html" target="_blank" rel="noopener noreferrer">开放情况以官方公告为准</a>。</li>
                        <li>贯一酒店连住 2 晚：含餐、私汤及最晚晚餐时间以订单为准；10 月 2 日早上退房。</li>
                    </ul>
                </section>
                ${renderPlaceNames()}
            `;
        }

        function renderDetail(dayData) {
            const detail = document.getElementById('detailContent');
            const eventsHtml = dayData.events.map(e => `
                <div class="timeline-item ${e.type || ''}">
                    <div class="time">${e.time}</div>
                    <div class="event">${e.event}</div>
                    ${e.note ? `<div class="note">${e.note}</div>` : ''}
                </div>
            `).join('');

            const hotelHtml = dayData.hotel
                ? `
                <div class="hotel-card">
                    <div class="hotel-label">🏨 当晚住宿</div>
                    <div class="hotel-name">${dayData.hotel.location} · ${dayData.hotel.nights}</div>
                    <div class="hotel-info">${dayData.hotel.note}</div>
                </div>
                `
                : `
                <div class="no-hotel">
                    当日不住宿，15:30 从成田机场起飞回国
                </div>
                `;

            detail.innerHTML = `
                <div class="detail-header">
                    <div class="badge">${dayData.badge}</div>
                    <h2>${dayData.title}</h2>
                    <div class="meta">${dayData.date} · ${dayData.meta}</div>
                </div>
                ${hotelHtml}
                <div class="timeline">
                    ${eventsHtml}
                </div>
                ${renderPlaceNames(dayData.day)}
            `;
        }

        function setActiveItem(mode, dayIndex = null) {
            const overviewBtn = document.getElementById('overviewButton');
            overviewBtn.classList.toggle('active', mode === 'overview');

            document.querySelectorAll('.day-item').forEach(el => {
                const isMatch = mode === 'day' && parseInt(el.dataset.index) === dayIndex;
                el.classList.toggle('active', isMatch);
            });
        }

        function selectOverview() {
            document.querySelector('.container').classList.add('overview-mode');
            setActiveItem('overview');
            document.getElementById('detailPanelTitle').textContent = '📝 行程总览';
            renderOverview();
            document.getElementById('detailContent').scrollTop = 0;
            map.invalidateSize();
            updateMap(overview);
        }

        function selectDay(index) {
            document.querySelector('.container').classList.remove('overview-mode');
            setActiveItem('day', index);
            const dayData = itinerary[index];
            document.getElementById('detailPanelTitle').textContent = '📝 当日详情';
            renderDetail(dayData);
            document.getElementById('detailContent').scrollTop = 0;
            map.invalidateSize();
            updateMap(dayData);
        }

        // 初始化
        initMap();
        renderDayList();
        bindOverviewButton();
        selectOverview();
    </script>
    <script>
        // 开发预览：检测文件修改后自动刷新页面
        (function() {
            let lastModified = null;
            const checkInterval = 1000;

            function checkUpdate() {
                fetch(window.location.href, { method: 'HEAD', cache: 'no-cache' })
                    .then(response => {
                        const mod = response.headers.get('Last-Modified');
                        if (lastModified && mod && lastModified !== mod) {
                            window.location.reload();
                        }
                        lastModified = mod;
                    })
                    .catch(() => {});
            }

            checkUpdate();
            setInterval(checkUpdate, checkInterval);
        })();
    </script>
